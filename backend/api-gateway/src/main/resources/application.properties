spring.application.name=api-gateway
server.port=9000

# ==========================================
# Eureka
# ==========================================
eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true

# ==========================================
# ==========================================
# Gateway Routes
# ==========================================

# Auth Service
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://auth-service
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# User Service
spring.cloud.gateway.server.webflux.routes[1].id=user-service
spring.cloud.gateway.server.webflux.routes[1].uri=lb://user-service
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/users/**

# Account Service
spring.cloud.gateway.server.webflux.routes[2].id=account-service
spring.cloud.gateway.server.webflux.routes[2].uri=lb://account-service
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/accounts/**

# Transaction Service
spring.cloud.gateway.server.webflux.routes[3].id=transaction-service
spring.cloud.gateway.server.webflux.routes[3].uri=lb://transaction-service
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/transactions/**
# ==========================================
# Actuator
# ==========================================
management.endpoints.web.exposure.include=health,info

# ==========================================
# OAuth2 Resource Server
# ==========================================
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://[::1]:8080/realms/apex-bank

# ==========================================
# Logging
# ==========================================
logging.level.org.springframework.cloud.gateway=INFO
logging.level.com.apexbank.gateway=DEBUG
# Beneficiary Service
spring.cloud.gateway.server.webflux.routes[4].id=beneficiary-service
spring.cloud.gateway.server.webflux.routes[4].uri=lb://beneficiary-service
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/beneficiaries/**

# Notification Service
spring.cloud.gateway.server.webflux.routes[5].id=notification-service
spring.cloud.gateway.server.webflux.routes[5].uri=lb://notification-service
spring.cloud.gateway.server.webflux.routes[5].predicates[0]=Path=/api/notifications/**
