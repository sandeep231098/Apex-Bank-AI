spring.application.name=user-service

server.port=8086

spring.datasource.url=jdbc:postgresql://localhost:5432/user_db
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=*

#################################################
# OAuth2 Resource Server (Keycloak)
#################################################

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8080/realms/apex-bank

spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:8080/realms/apex-bank/protocol/openid-connect/certs
# Eureka
#################################################

eureka.client.service-url.defaultZone=http://localhost:8761/eureka
eureka.instance.prefer-ip-address=true


springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html